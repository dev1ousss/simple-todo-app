services:
  redis:
    image: redis:7-alpine
    container_name: sta_redis
    restart: always
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    container_name: sta_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - todo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:admin@db:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: node:24-slim
    container_name: todo_frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./todo-app-frontend:/app
    environment:
      - WATCHPACK_POLLING=true
      - HOST=0.0.0.0
    command: npm start
    depends_on:
      - backend

volumes:
  todo_db_data: